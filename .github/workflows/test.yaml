name: RTL Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Icarus Verilog & Cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb pytest cocotb-test

      - name: Run verification testbench
        env:
          SIM: icarus
        run: |
          python run.py

      - name: List sim_build directory
        run: |
          ls -la sim_build/

      - name: Upload Waveform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waveform-artifacts
          path: |
            sim_build/*.fst
            sim_build/*.vcd